# Ingress only: the Supervisor proxies /api/hassio_ingress/<token>/... here with the prefix
# stripped, and names the Home Assistant user in X-Remote-User-*. Nothing else may connect, or
# those headers could be forged.
server {
    listen 8099;
    allow 172.30.32.2;
    deny all;

    root /app/web;
    index index.html;
    absolute_redirect off;

    location /api/ {
        client_max_body_size 48m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
